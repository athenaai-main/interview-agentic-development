<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Factory server review</title><style>body{font:16px system-ui;max-width:1000px;margin:40px auto;padding:0 24px;color:#152338;background:#f5f7fa}article{background:white;padding:24px;margin:18px 0;border:1px solid #ccd5e0;border-radius:12px}button,input{font:inherit;padding:10px;margin:4px}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#244bb0}.error{color:#a12a25}h1{margin-bottom:8px}</style><h1>Factory server review</h1><p>Local live server. The separate application prototype uses fixtures.</p><section id="pair"><input id="code" placeholder="Pairing code from server terminal"><button id="pairButton">Pair human session</button></section><p id="status" role="status"></p><main id="content"></main><script>
let csrf='',snapshot;const el=id=>document.getElementById(id);const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,body){const r=await fetch('/api/v1'+path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json','X-CSRF-Token':csrf,'Idempotency-Key':crypto.randomUUID()}: {},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.message||d.code);return d;}
function report(e){el('status').textContent=e.message;el('status').className='error';}
el('pairButton').onclick=async()=>{try{const s=await api('/auth/pairing/complete',{code:el('code').value});csrf=s.csrf;await refresh();}catch(e){report(e);}};
function preview(label,p){return `<article><h3>${label}</h3><p>${escape(p?.status||'not started')} · ${escape(p?.commitSha||'')}</p>${p?.url?`<a href="${escape(p.url)}" target="_blank" rel="noopener">Open ${label}</a>`:''}${p?.startupError?`<pre class="error">${escape(p.startupError)}</pre>`:''}</article>`;}
async function refresh(){try{const s=await api('/auth/session');csrf=s.csrf;el('pair').hidden=true;const cid=location.pathname.split('/')[2];
if(cid){snapshot=await api('/checkpoints/'+cid);el('content').innerHTML=`<article><h2>${escape(snapshot.kind)} checkpoint</h2><p>${escape(snapshot.status)} · issue version ${snapshot.issueVersion}</p><pre>${escape(JSON.stringify(snapshot.artifactRefs,null,2))}</pre>${snapshot.allowedActions.map(a=>`<button data-decision="${a}">${a==='approve'?'Approve':'Reject'}</button>`).join('')}<button id="copy">Copy harness prompt</button><button id="restart">Restart previews</button><pre>${escape(snapshot.harnessPrompt)}</pre>${snapshot.decision?`<pre>${escape(JSON.stringify(snapshot.decision,null,2))}</pre>`:''}</article>${preview('Baseline',snapshot.previews.baseline)}${preview('Candidate',snapshot.previews.candidate)}<article><h3>Artifacts and review evidence</h3><pre>${escape(JSON.stringify(snapshot.artifacts,null,2))}</pre></article>`;
el('copy').onclick=()=>navigator.clipboard.writeText(snapshot.harnessPrompt).then(()=>{el('status').textContent='Prompt copied';});el('restart').onclick=async()=>{try{el('status').textContent='Starting previews…';await api('/issues/'+snapshot.issueId+'/previews/restart',{});await refresh();}catch(e){report(e);await refresh();}};
document.querySelectorAll('[data-decision]').forEach(b=>b.onclick=async()=>{document.querySelectorAll('[data-decision]').forEach(x=>x.disabled=true);try{await api('/checkpoints/'+cid+'/decision',{decision:b.dataset.decision,expectedIssueVersion:snapshot.issueVersion,artifactRefs:snapshot.artifactRefs});await refresh();}catch(e){report(e);await refresh();}});
}else{const d=await api('/issues');el('content').innerHTML=`<p>Workers ${d.workers.busy}/${d.workers.capacity} · queued ${d.workers.queued}</p>`+d.issues.map(i=>`<article><h2>${escape(i.title)}</h2><p>${escape(i.state)} · ${escape(i.baselineSha)}</p>${i.checkpointId?`<a href="/checkpoints/${i.checkpointId}">Open checkpoint</a>`:''}<pre>${escape(JSON.stringify(i,null,2))}</pre>${i.state==='paused'&&i.resumeJobType?`<button data-resume="${i.id}" data-version="${i.version}">Resume after reconciling side effects</button>`:''}</article>`).join('');document.querySelectorAll('[data-resume]').forEach(b=>b.onclick=async()=>{try{await api('/issues/'+b.dataset.resume+'/resume',{expectedIssueVersion:Number(b.dataset.version),sideEffectsReconciled:true});await refresh();}catch(e){report(e);}});}
}catch(e){report(e);}}
refresh();setInterval(()=>{if(csrf)refresh();},5000);
</script></html>
