<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Local Factory · Human review</title>
    <link rel="stylesheet" href="/app/styles.css" />
    <script type="module" src="/app/app.mjs"></script>
  </head>
  <body>
    <header>
      <a class="brand" href="/" style="color: inherit; text-decoration: none"
        >Local Factory <span>Human review</span></a
      ><span class="pill">Local</span>
    </header>
    <main>
      <p id="status" role="status" aria-live="polite"></p>
      <section id="pair" class="card pair" hidden>
        <div class="eyebrow">Human browser session</div>
        <h1>Connect to your factory</h1>
        <p class="muted">
          Enter the pairing code printed in your server terminal. This browser
          session lets you personally review and decide on checkpoints.
        </p>
        <form id="pairForm">
          <label for="pairCode">Pairing code</label
          ><input id="pairCode" autocomplete="off" required /><button
            class="primary"
          >
            Connect browser
          </button>
        </form>
      </section>
      <div id="app"><p class="muted">Loading your factory…</p></div>
    </main>
  </body>
</html>
